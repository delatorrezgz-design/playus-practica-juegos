<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1f3a5f">
<style>:root{padding:env(safe-area-inset-top,0px) 0 env(safe-area-inset-bottom,0px);box-sizing:border-box}body{margin:0}[hidden]{display:none!important}</style>
<title>Carriles</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=DM+Sans:opsz,wght@9..40,400;9..40,600&display=swap">
<style>
/* Layout: one-screen app. Thin top bar, the playfield fills the rest, a single card floats over it between runs. */
:root{
  --sky:#e4edf0; --hills:#cfdde2; --col:#1f3a5f; --cap:#2f5587; --floor:#b7c8ce; --floor-line:#9fb3ba;
  --token:#f2622e; --ring:#fff3e6; --ink:#14233a; --muted:#566779; --surface:#ffffff; --line:#d3dde2;
  --page:#f3f7f8; --on-token:#ffffff; --road:#33485f; --dash:#f4ead8; --glass:#14233a;
  --display:"Bricolage Grotesque","Trebuchet MS",system-ui,sans-serif;
  --body:"DM Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --sky:#101c2c; --hills:#172a40; --col:#7fb3d6; --cap:#a9d0ea; --floor:#1c3049; --floor-line:#2b4566;
  --token:#ff8a52; --ring:#3a2114; --ink:#e8eff5; --muted:#94a7ba; --surface:#18283d; --line:#2a3e58;
  --page:#0b1420; --on-token:#1d0e05; --road:#1c3049; --dash:#94a7ba; --glass:#0b1420; color-scheme:dark } }
:root[data-theme="dark"]{
  --sky:#101c2c; --hills:#172a40; --col:#7fb3d6; --cap:#a9d0ea; --floor:#1c3049; --floor-line:#2b4566;
  --token:#ff8a52; --ring:#3a2114; --ink:#e8eff5; --muted:#94a7ba; --surface:#18283d; --line:#2a3e58;
  --page:#0b1420; --on-token:#1d0e05; --road:#1c3049; --dash:#94a7ba; --glass:#0b1420; color-scheme:dark }

html,body{height:100%}
body{background:var(--page);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.4;
  -webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;overscroll-behavior:none}
.app{height:100%;display:flex;flex-direction:column;gap:10px;padding-block:10px;max-width:560px;margin:0 auto;box-sizing:border-box;
  padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px))}
.bar{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.name{font-family:var(--display);font-weight:800;font-size:22px;letter-spacing:-.02em}
.home{color:var(--muted);text-decoration:none;padding:4px 8px 4px 0}
.seg{display:flex;border:1.5px solid var(--line);border-radius:999px;padding:3px;background:var(--surface)}
.seg button{border:0;background:none;color:var(--muted);font:600 13px var(--body);padding:7px 12px;white-space:nowrap;border-radius:999px;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--surface)}
.stage{position:relative;flex:1;min-height:0;border-radius:18px;overflow:hidden;background:var(--page);touch-action:none;cursor:pointer}
canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
.hud{position:absolute;inset:18px 16px auto;display:flex;justify-content:space-between;align-items:flex-start;pointer-events:none}
.score small{font-size:.4em;margin-left:3px}
.score{font-family:var(--display);font-weight:800;font-size:54px;line-height:1;color:var(--ink);font-variant-numeric:tabular-nums}
.chip{font:600 12px var(--body);color:var(--muted);background:var(--surface);border-radius:999px;padding:5px 10px;font-variant-numeric:tabular-nums}
.over{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;padding:14px;pointer-events:none}
.card{pointer-events:auto;cursor:default;background:var(--surface);border-radius:16px;padding:18px;width:100%;max-width:340px;max-height:100%;overflow:auto;
  box-sizing:border-box;display:flex;flex-direction:column;gap:14px;box-shadow:0 10px 30px rgba(10,25,45,.18)}
.card h2{margin:0;font-family:var(--display);font-weight:800;font-size:26px;letter-spacing:-.02em;text-wrap:balance}
.card p{margin:0;color:var(--muted)}
.big{font-family:var(--display);font-weight:800;font-size:64px;line-height:.9;font-variant-numeric:tabular-nums}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;border-block:1.5px solid var(--line);padding-block:10px}
.stats div{display:flex;flex-direction:column;gap:2px;min-width:0}
.stats dt,.lbl{font-size:11px;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);font-weight:600}
.stats dd{margin:0;font-family:var(--display);font-weight:600;font-size:20px;font-variant-numeric:tabular-nums}
.stats{margin:0}
.days{display:flex;align-items:flex-end;gap:6px;height:56px}
.days div{flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:3px;height:100%;font-size:11px;color:var(--muted);font-variant-numeric:tabular-nums}
.days i{display:block;width:100%;background:var(--col);border-radius:4px 4px 0 0;min-height:2px}
.days .today i{background:var(--token)}
.row{display:flex;gap:8px}
.btn{flex:1;border:1.5px solid var(--line);background:none;color:var(--ink);font:600 15px var(--body);padding:12px;border-radius:12px;cursor:pointer}
.btn.go{background:var(--token);border-color:var(--token);color:var(--on-token)}
.btn:focus-visible,.seg button:focus-visible,input:focus-visible{outline:3px solid var(--cap);outline-offset:2px}
.field{display:flex;flex-direction:column;gap:2px}
.field label{display:flex;justify-content:space-between;font-size:13px}
.field output{font-variant-numeric:tabular-nums;color:var(--muted)}
.field input{width:100%;accent-color:var(--token);margin:0}
.snd{display:flex;align-items:center;gap:8px;font-size:14px}
.snd input{accent-color:var(--token);width:18px;height:18px;margin:0}
</style>

</head>
<body>
<div class="app">
  <div class="bar">
    <div class="name"><a class="home" href="../" aria-label="Volver al menú de juegos">‹</a> Carriles</div>
    <div class="seg" role="group" aria-label="Modo de juego">
      <button id="mode-dia" type="button">Reto del día</button>
      <button id="mode-libre" type="button">Práctica libre</button>
    </div>
  </div>
  <div class="stage" id="stage">
    <canvas id="cv"></canvas>
    <div class="hud"><div class="score" id="score">0</div><div class="chip" id="speed"></div></div>
    <div class="over" id="over"><div class="card" id="card"></div></div>
  </div>
</div>

<script>
(function(){
"use strict";
/* Campo lógico 400x620. Horizonte en YH; el morro del jugador en s=1. Distancias en metros del marcador.
   Cada coche lleva tau = segundos que le faltan para tocar al jugador (a velocidad inicial). Su escala en pantalla es
   s = TC/(TC+tau) (medido: 1/ancho baja en línea recta con el tiempo) y su altura y = YV + AY*s, tapada por el cambio de rasante en YH. */
var H=620, FW=400, STEP=1/120, TRIES=2, YH=328, YV=176, AY=267, CX=200, LANE=132, TC=0.4, PW=96, EW=81;
var DEF={v0:14.2,acc:0.68,acc2:0.03,vmax:55,tau:59,tvis:1.09,pvis:0.5,first:51,g0:1.75,gdec:0.04,gmin:0.7,dbl:60,hitw:0.66,hitd:0.13}, CFGV=2;
var FIELDS=[["v0","Velocidad inicial (m/s)",8,30,0.1],["acc","Aceleración (m/s cada segundo)",0,3,0.02],["acc2","Cuánto crece la aceleración",0,0.1,0.005],["vmax","Velocidad máxima (m/s)",20,90,1],
  ["tau","Lentitud del cambio de carril (ms)",20,150,1],["tvis","Tiempo de aviso al empezar (s)",0.5,2,0.01],["pvis","Cuánto se acorta el aviso con la velocidad",0,1,0.05],
  ["first","Metros hasta el primer coche",20,120,0.5],["g0","Separación entre oleadas al empezar (s)",0.6,2.5,0.05],["gdec","Reducción por oleada (s)",0,0.08,0.005],["gmin","Separación mínima (s)",0.3,1.5,0.05],
  ["dbl","Oleadas de dos coches, máximo (%)",0,90,5],["hitw","Ancho de la zona de choque (carriles)",0.4,1,0.02],["hitd","Duración de la zona de choque (s)",0.05,0.24,0.01]];

var S={best:0,hist:[],days:{},cfg:Object.assign({},DEF),mode:"dia"};
try{var raw=localStorage.getItem("carriles_v1"); if(raw){var o=JSON.parse(raw); S=Object.assign(S,o); S.cfg=o.cfgV===CFGV?Object.assign({},DEF,o.cfg||{}):Object.assign({},DEF);} S.cfgV=CFGV; if(S.mode!=="dia")S.mode="libre"; if(S.snd===undefined)S.snd=true;}catch(e){}
function save(){try{localStorage.setItem("carriles_v1",JSON.stringify(S));}catch(e){}}
function dayKey(d){d=d||new Date();return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");}
function today(){var k=dayKey(); if(!S.days[k])S.days[k]=[]; return S.days[k];}

var stage=document.getElementById("stage"), cv=document.getElementById("cv"), ctx=cv.getContext("2d");
var elScore=document.getElementById("score"), elSpeed=document.getElementById("speed"), over=document.getElementById("over"), card=document.getElementById("card");
var bDia=document.getElementById("mode-dia"), bLibre=document.getElementById("mode-libre");
var scale=1, ox=0, C={};
function colors(){var cs=getComputedStyle(document.documentElement);["sky","hills","col","cap","floor","floor-line","token","ring","ink","road","dash","glass"].forEach(function(n){C[n]=cs.getPropertyValue("--"+n).trim();});}
function resize(){var r=stage.getBoundingClientRect(), d=Math.min(window.devicePixelRatio||1,3); if(!r.height)return;
  cv.width=Math.round(r.width*d); cv.height=Math.round(r.height*d); scale=Math.min(r.width/FW,r.height/H);
  ox=(r.width-FW*scale)/2; var oy=(r.height-H*scale)/2; ctx.setTransform(scale*d,0,0,scale*d,ox*d,oy*d);
  var hd=elScore.parentNode; hd.style.top=(oy+10)+"px"; hd.style.left=(ox+14)+"px"; hd.style.right=(ox+14)+"px";}
new ResizeObserver(resize).observe(stage);
new MutationObserver(colors).observe(document.documentElement,{attributes:true,attributeFilter:["data-theme"]});
matchMedia("(prefers-color-scheme: dark)").addEventListener("change",colors);
colors(); resize();

var PAINT=["#3d6fb0","#8a63c9","#c9a23a","#4f9a6c","#b8566f"];
var state="ready", view="main", lane=1, px=1, cars=[], dist=0, tRun=0, tOff=0, nWave=0, nextAt=0, deadAt=0, runIdx=-1, lastScore=null, score=0, shake=0;
function speed(){var c=S.cfg; return Math.min(c.vmax, c.v0+c.acc*tRun+c.acc2*tRun*tRun);}
function approach(){var c=S.cfg; return Math.pow(speed()/c.v0,c.pvis);}
function triesLeft(){return TRIES-today().length;}
function blocked(){return S.mode==="dia"&&triesLeft()<=0;}

function wave(){
  var c=S.cfg, two=nWave>=5&&Math.random()*100<Math.min(c.dbl,(nWave-4)*6), ls;
  if(nWave===0) ls=[1];
  else if(nWave===1) ls=[2];
  else if(two){var free=Math.floor(Math.random()*3); ls=[0,1,2].filter(function(l){return l!==free;});}
  else ls=[Math.random()<0.5?lane:Math.floor(Math.random()*3)];
  ls.forEach(function(l){cars.push({lane:l,tau:c.tvis,col:PAINT[Math.floor(Math.random()*PAINT.length)]});});
  nWave++; nextAt=tRun+Math.max(c.gmin,c.g0-c.gdec*nWave);
}
function start(){
  if(blocked())return;
  cars=[]; nWave=0; dist=0; tRun=0; score=0; lane=1; px=1; nextAt=Infinity; shake=0;
  if(S.mode==="dia"){today().push(0); runIdx=today().length-1; save();} else runIdx=-1;
  state="play"; over.hidden=true; hud();
}
var AC=null;
function tone(f,f2,dur,vol,type){ if(!S.snd)return; try{ AC=AC||new (window.AudioContext||window.webkitAudioContext)(); if(AC.state==="suspended")AC.resume();
  var o=AC.createOscillator(), g=AC.createGain(), t=AC.currentTime; o.type=type||"sine"; o.frequency.setValueAtTime(f,t); o.frequency.exponentialRampToValueAtTime(f2,t+dur);
  g.gain.setValueAtTime(vol,t); g.gain.exponentialRampToValueAtTime(0.001,t+dur); o.connect(g); g.connect(AC.destination); o.start(t); o.stop(t+dur);}catch(e){} }
function move(d){var n=Math.max(0,Math.min(2,lane+d)); if(n===lane)return; lane=n; tone(175,120,0.12,0.3,"triangle");}
function die(){
  state="dead"; deadAt=performance.now(); lastScore=score; shake=1; tone(160,40,0.35,0.4,"sawtooth");
  S.hist.push(score); if(S.hist.length>200)S.hist.shift(); if(score>S.best)S.best=score;
  if(runIdx>=0)today()[runIdx]=score; save(); view="main"; panel();
}
function update(dt){
  var c=S.cfg, v=speed(), r=approach();
  tRun+=dt; dist+=v*dt; tOff+=r*dt;
  px+=(lane-px)*(1-Math.exp(-dt*1000/c.tau));
  if(nWave===0){ if(dist>=c.first) wave(); } else if(tRun>=nextAt) wave();
  for(var i=cars.length-1;i>=0;i--){var e=cars[i]; e.tau-=r*dt;
    if(e.tau<=0&&e.tau>=-c.hitd&&Math.abs(px-e.lane)<c.hitw){die();return;}
    if(e.tau<-0.25)cars.splice(i,1);}
  var s=Math.floor(dist); if(s!==score){score=s; if(runIdx>=0)today()[runIdx]=score; hud();}
}
function hud(){elScore.innerHTML=score+"<small>m</small>"; elSpeed.textContent="Velocidad "+speed().toFixed(1).replace(".",",")+" m/s";}

function rr(x,y,w,h,r){ctx.beginPath();ctx.roundRect(x,y,w,h,r);ctx.fill();}
function sOf(tau){return TC/(TC+tau);}
function gy(s){return Math.max(YH+2,YV+AY*s);}
function car(cx,bottom,w,body,front){
  var h=w*0.6;
  ctx.fillStyle=C.glass; rr(cx-w*0.46,bottom-w*0.12,w*0.2,w*0.14,w*0.03); rr(cx+w*0.26,bottom-w*0.12,w*0.2,w*0.14,w*0.03);
  ctx.fillStyle=body; rr(cx-w/2,bottom-h,w,h*0.9,w*0.09); rr(cx-w*0.38,bottom-h*1.42,w*0.76,h*0.6,w*0.09);
  ctx.fillStyle=C.glass; rr(cx-w*0.31,bottom-h*1.3,w*0.62,h*0.36,w*0.05);
  ctx.fillStyle=front?C.dash:C.ring; rr(cx-w*0.43,bottom-h*0.62,w*0.2,h*0.2,w*0.04); rr(cx+w*0.23,bottom-h*0.62,w*0.2,h*0.2,w*0.04);
  ctx.globalAlpha=0.25; ctx.fillStyle=C.glass; rr(cx-w/2,bottom-h*0.3,w,h*0.2,w*0.04); ctx.globalAlpha=1;
}
function draw(now){
  var i,s;
  ctx.save(); ctx.setTransform(1,0,0,1,0,0); ctx.clearRect(0,0,cv.width,cv.height); ctx.restore();
  ctx.save(); ctx.beginPath(); ctx.rect(0,0,FW,H); ctx.clip();
  if(shake>0.02){ctx.translate(Math.sin(now/18)*6*shake,Math.cos(now/23)*4*shake); shake*=0.92;}
  ctx.fillStyle=C.sky; ctx.fillRect(-10,-10,FW+20,YH+10);
  ctx.fillStyle=C.hills; ctx.beginPath(); ctx.moveTo(-10,YH);
  for(var x=-10;x<=FW+20;x+=20){ctx.lineTo(x,YH-70-34*Math.sin(x*0.013+1)-18*Math.sin(x*0.031));}
  ctx.lineTo(FW+20,YH); ctx.closePath(); ctx.fill();
  ctx.fillStyle=C.floor; ctx.fillRect(-10,YH,FW+20,H-YH+10);
  // calzada: 3 carriles, bordes a ±1,5 carriles; por encima del cambio de rasante no se ve
  var s0=(YH-YV)/AY, sn=1.9;
  ctx.fillStyle=C.road; ctx.beginPath(); ctx.moveTo(CX-LANE*1.5*s0,YH); ctx.lineTo(CX+LANE*1.5*s0,YH); ctx.lineTo(CX+LANE*1.5*sn,gy(sn)); ctx.lineTo(CX-LANE*1.5*sn,gy(sn)); ctx.closePath(); ctx.fill();
  // rayas: en "segundos de distancia" (u = TC/s). Corren ~4 veces más deprisa que se acercan los coches (medido)
  var per=1.3, off=(tOff*4)%per, u; ctx.fillStyle=C.dash;
  for(u=TC/sn-per+off; u<TC/s0; u+=per){ var ua=Math.max(TC/sn,u), ub=Math.min(TC/s0,u+per*0.33); if(ub<=ua)continue; var sa=TC/ua, sb=TC/ub;
    for(i=-1;i<=1;i+=2){ctx.beginPath(); ctx.moveTo(CX+i*LANE/2*sb-3*sb,gy(sb)); ctx.lineTo(CX+i*LANE/2*sb+3*sb,gy(sb)); ctx.lineTo(CX+i*LANE/2*sa+3*sa,gy(sa)); ctx.lineTo(CX+i*LANE/2*sa-3*sa,gy(sa)); ctx.closePath(); ctx.fill();}}
  var sorted=cars.slice().sort(function(a,b){return b.tau-a.tau;}), drawn=false;
  function player(){ var pxs=CX+(px-1)*LANE, tilt=(lane-px)*0.22, bob=state==="ready"?2*Math.sin(now/260):0;
    ctx.save(); ctx.translate(pxs,518+bob); ctx.rotate(tilt); car(0,0,PW,C.token,false); ctx.restore(); drawn=true; }
  for(i=0;i<sorted.length;i++){var e=sorted[i]; if(!drawn&&e.tau<-0.07)player(); s=sOf(e.tau);
    ctx.globalAlpha=Math.min(1,(S.cfg.tvis-e.tau)/0.1+0.15); car(CX+(e.lane-1)*LANE*s,gy(s),EW*s,e.col,true); ctx.globalAlpha=1;}
  if(!drawn)player();
  ctx.restore();
}
var last=0, acc=0;
function frame(now){
  var dt=Math.min(0.1,(now-last)/1000); last=now;
  if(state==="play"){acc+=dt; while(acc>=STEP&&state==="play"){update(STEP);acc-=STEP;} if(state==="play")elSpeed.textContent="Velocidad "+speed().toFixed(1).replace(".",",")+" m/s";} else acc=0;
  draw(now); requestAnimationFrame(frame);
}

function avg(){var h=S.hist.slice(-10); if(!h.length)return "–"; return Math.round(h.reduce(function(a,b){return a+b;},0)/h.length);}
function dayBest(k){var a=S.days[k]; return a&&a.length?Math.max.apply(null,a):null;}
function panel(){
  over.hidden=false; bDia.setAttribute("aria-pressed",S.mode==="dia"); bLibre.setAttribute("aria-pressed",S.mode==="libre");
  if(view==="cfg"){
    card.innerHTML='<h2>Ajustes</h2><p>Los primeros 100 metros (velocidad, cambio de carril, aviso, zona de choque y los dos primeros coches) están medidos en grabaciones reales; lo que pasa después es una estimación hasta tener una partida larga. Se guardan en este móvil.</p>'+
      FIELDS.map(function(f){return '<div class="field"><label for="f-'+f[0]+'"><span>'+f[1]+'</span><output id="o-'+f[0]+'">'+S.cfg[f[0]]+'</output></label>'+
      '<input type="range" id="f-'+f[0]+'" min="'+f[2]+'" max="'+f[3]+'" step="'+f[4]+'" value="'+S.cfg[f[0]]+'"></div>';}).join("")+
      '<label class="snd" for="f-snd"><input type="checkbox" id="f-snd"'+(S.snd?" checked":"")+'> Sonido al cambiar de carril y al chocar</label>'+
      '<div class="row"><button class="btn" id="b-reset" type="button">Valores iniciales</button><button class="btn go" id="b-back" type="button">Listo</button></div>';
    FIELDS.forEach(function(f){var inp=document.getElementById("f-"+f[0]); inp.addEventListener("input",function(){S.cfg[f[0]]=parseFloat(inp.value);document.getElementById("o-"+f[0]).textContent=inp.value;save();hud();});});
    document.getElementById("f-snd").onchange=function(e){S.snd=e.target.checked;save();};
    document.getElementById("b-reset").onclick=function(){S.cfg=Object.assign({},DEF);save();panel();hud();};
    document.getElementById("b-back").onclick=function(){view="main";panel();};
    return;
  }
  var dia=S.mode==="dia", left=triesLeft(), tb=dayBest(dayKey()), html="";
  if(state==="dead"&&lastScore!==null){
    html+='<div><div class="lbl">'+(lastScore>=S.best&&lastScore>0?"Nuevo récord":"Metros")+'</div><div class="big">'+lastScore+'</div></div>';
  } else {
    html+='<h2>'+(dia?"Reto del día":"Práctica libre")+'</h2>';
  }
  if(dia) html+='<p>'+(left>0?(left===TRIES?"Tienes "+TRIES+" intentos. Cuenta tu mejor marca del día.":"Te queda"+(left>1?"n ":" ")+left+" intento"+(left>1?"s":"")+" hoy. Cuenta tu mejor marca."):"Has gastado los "+TRIES+" intentos de hoy. Marca del día: "+tb+" m. Sigue entrenando en práctica libre.")+'</p>';
  else if(state!=="dead") html+='<p>Intentos ilimitados. Toca el lado izquierdo o derecho para cambiar un carril cada vez y esquiva los coches. Cada vez van más rápido y llegan de dos en dos.</p>';
  html+='<dl class="stats"><div><dt>Récord</dt><dd>'+S.best+'</dd></div><div><dt>Media 10</dt><dd>'+avg()+'</dd></div><div><dt>Hoy</dt><dd>'+(tb===null?"–":tb)+'</dd></div></dl>';
  var ds=[],mx=1,i; for(i=6;i>=0;i--){var d=new Date();d.setDate(d.getDate()-i);var k=dayKey(d),b=dayBest(k);ds.push([d,b,i===0]);if(b>mx)mx=b;}
  html+='<div><div class="lbl">Reto del día, últimos 7 días</div><div class="days">'+ds.map(function(e){return '<div'+(e[2]?' class="today"':'')+'><span>'+(e[1]===null?"·":e[1])+'</span><i style="height:'+(e[1]?Math.round(e[1]/mx*30)+2:2)+'px"></i><span>'+"DLMXJVS"[e[0].getDay()]+'</span></div>';}).join("")+'</div></div>';
  html+='<div class="row"><button class="btn" id="b-cfg" type="button">Ajustes</button>'+
    (blocked()?'<button class="btn go" id="b-libre" type="button">Práctica libre</button>':'<button class="btn go" id="b-go" type="button">'+(state==="dead"?"Otra vez":"Jugar")+'</button>')+'</div>';
  card.innerHTML=html;
  document.getElementById("b-cfg").onclick=function(){view="cfg";panel();};
  var go=document.getElementById("b-go"); if(go)go.onclick=start;
  var bl=document.getElementById("b-libre"); if(bl)bl.onclick=function(){setMode("libre");};
}
function setMode(m){if(state==="play")return; S.mode=m; save(); state="ready"; lastScore=null; cars=[]; score=0; dist=0; tRun=0; lane=1; px=1; view="main"; hud(); panel();}
bDia.onclick=function(){setMode("dia");}; bLibre.onclick=function(){setMode("libre");};

function tap(dir){
  if(state==="play"){move(dir);return;}
  if(view==="cfg")return;
  if(state==="dead"&&performance.now()-deadAt<600)return;
  start();
}
stage.addEventListener("pointerdown",function(e){ if(e.target.closest(".card"))return; e.preventDefault();
  var r=stage.getBoundingClientRect(); tap(e.clientX<r.left+r.width/2?-1:1); });
window.addEventListener("keydown",function(e){ if(e.repeat||(e.target.closest&&e.target.closest("input,button")))return;
  if(e.code==="ArrowLeft"||e.code==="KeyA"){e.preventDefault();tap(-1);} else if(e.code==="ArrowRight"||e.code==="KeyD"){e.preventDefault();tap(1);} else if(e.code==="Space"&&state!=="play"){e.preventDefault();tap(0);} });

hud(); panel(); requestAnimationFrame(function(n){last=n;frame(n);});
})();
</script>
</body>
