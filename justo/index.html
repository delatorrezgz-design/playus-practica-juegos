<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1f3a5f">
<style>:root{padding:env(safe-area-inset-top,0px) 0 env(safe-area-inset-bottom,0px);box-sizing:border-box}body{margin:0}[hidden]{display:none!important}</style>
<title>Justo</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=DM+Sans:opsz,wght@9..40,400;9..40,600&display=swap">
<style>
/* Layout: one-screen app. Thin top bar, the playfield fills the rest, a single card floats over it between runs. */
:root{
  --sky:#e4edf0; --hills:#cfdde2; --col:#1f3a5f; --cap:#2f5587; --floor:#b7c8ce; --floor-line:#9fb3ba;
  --token:#f2622e; --ring:#fff3e6; --ink:#14233a; --muted:#566779; --surface:#ffffff; --line:#d3dde2;
  --page:#f3f7f8; --on-token:#ffffff;
  --display:"Bricolage Grotesque","Trebuchet MS",system-ui,sans-serif;
  --body:"DM Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --sky:#101c2c; --hills:#172a40; --col:#7fb3d6; --cap:#a9d0ea; --floor:#1c3049; --floor-line:#2b4566;
  --token:#ff8a52; --ring:#3a2114; --ink:#e8eff5; --muted:#94a7ba; --surface:#18283d; --line:#2a3e58;
  --page:#0b1420; --on-token:#1d0e05; color-scheme:dark } }
:root[data-theme="dark"]{
  --sky:#101c2c; --hills:#172a40; --col:#7fb3d6; --cap:#a9d0ea; --floor:#1c3049; --floor-line:#2b4566;
  --token:#ff8a52; --ring:#3a2114; --ink:#e8eff5; --muted:#94a7ba; --surface:#18283d; --line:#2a3e58;
  --page:#0b1420; --on-token:#1d0e05; color-scheme:dark }

html,body{height:100%}
body{background:var(--page);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.4;
  -webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;-webkit-touch-callout:none;overscroll-behavior:none}
.app{height:100%;display:flex;flex-direction:column;gap:10px;padding-block:10px;max-width:560px;margin:0 auto;box-sizing:border-box;
  padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px))}
.bar{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.name{font-family:var(--display);font-weight:800;font-size:22px;letter-spacing:-.02em}
.home{color:var(--muted);text-decoration:none;padding:4px 8px 4px 0}
.stage{position:relative;flex:1;min-height:0;border-radius:18px;overflow:hidden;background:var(--page);touch-action:none;cursor:pointer}
canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
.hud{position:absolute;inset:18px 16px auto;display:flex;justify-content:flex-end;align-items:flex-start;pointer-events:none}
.btn.clr{flex:none;font-size:13px;padding:8px;color:var(--muted)}
.days div{font-size:10px}
.chip{font:600 12px var(--body);color:var(--muted);background:var(--surface);border-radius:999px;padding:5px 10px;font-variant-numeric:tabular-nums}
.over{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;padding:14px;pointer-events:none}
.card{pointer-events:auto;cursor:default;background:var(--surface);border-radius:16px;padding:18px;width:100%;max-width:340px;max-height:100%;overflow:auto;
  box-sizing:border-box;display:flex;flex-direction:column;gap:14px;box-shadow:0 10px 30px rgba(10,25,45,.18)}
.card h2{margin:0;font-family:var(--display);font-weight:800;font-size:26px;letter-spacing:-.02em;text-wrap:balance}
.card p{margin:0;color:var(--muted)}
.big{font-family:var(--display);font-weight:800;font-size:52px;line-height:.95;font-variant-numeric:tabular-nums;white-space:nowrap}
.big small{font-size:.5em;font-weight:600;margin-left:4px}
.big.bad{color:var(--token)}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;border-block:1.5px solid var(--line);padding-block:10px}
.stats div{display:flex;flex-direction:column;gap:2px;min-width:0}
.stats dt,.lbl{font-size:11px;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);font-weight:600}
.stats dd{margin:0;font-family:var(--display);font-weight:600;font-size:20px;font-variant-numeric:tabular-nums}
.stats{margin:0}
.days{display:flex;align-items:flex-end;gap:6px;height:56px}
.days div{flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:3px;height:100%;font-size:11px;color:var(--muted);font-variant-numeric:tabular-nums;min-width:0}
.days i{display:block;width:100%;background:var(--col);border-radius:4px 4px 0 0;min-height:2px}
.days .today i{background:var(--token)}
.days .fail span{color:var(--token);font-weight:600}
.days .fail i{background:var(--line)}
.note{font-size:13px;margin-top:6px!important}
.row{display:flex;gap:8px}
.btn{flex:1;border:1.5px solid var(--line);background:none;color:var(--ink);font:600 15px var(--body);padding:12px;border-radius:12px;cursor:pointer}
.btn.go{background:var(--token);border-color:var(--token);color:var(--on-token)}
.btn:focus-visible,input:focus-visible{outline:3px solid var(--cap);outline-offset:2px}
.field{display:flex;flex-direction:column;gap:2px}
.field label{display:flex;justify-content:space-between;gap:8px;font-size:13px}
.field output{font-variant-numeric:tabular-nums;color:var(--muted)}
.field input{width:100%;accent-color:var(--token);margin:0}
.snd{display:flex;align-items:center;gap:8px;font-size:14px}
.snd input{accent-color:var(--token);width:18px;height:18px;margin:0}
</style>

</head>
<body>
<div class="app">
  <div class="bar">
    <div class="name"><a class="home" href="../" aria-label="Volver al menú de juegos">‹</a> Justo</div>
  </div>
  <div class="stage" id="stage">
    <canvas id="cv"></canvas>
    <div class="hud"><div class="chip" id="rec" hidden></div></div>
    <div class="over" id="over"><div class="card" id="card"></div></div>
  </div>
</div>

<script>
(function(){
"use strict";
/* Campo lógico 400x620. Un toque pone en marcha el cronómetro y otro lo para; el anillo da una vuelta entera en "target" segundos.
   El tiempo no sale de los fotogramas sino de la hora exacta de cada toque (event.timeStamp, en milisegundos con decimales),
   así que el resultado tiene cuatro decimales de verdad. Si el cronómetro llega a "target" sin que hayas parado, te has pasado.
   Medido en el real (vídeo de YouTube, 30 fps, que no está acelerado): cronómetro a velocidad de reloj (1,0005 ± 0,0004),
   anillo lineal de 0 a 7 s empezando arriba y en el sentido del reloj, marcador con dos decimales redondeados
   (paró en 6,9976 y enseñaba 7,00), resultado exacto con cuatro decimales y lo que faltó = 7 − resultado. */
var H=620, FW=400, CX=200, CY=262, RM=128, RW=26;
var DEF={target:7,speed:1,lag:0,dec:2}, CFGV=1;
var FIELDS=[["target","Segundos a los que hay que parar",3,15,0.5],
  ["speed","Velocidad del cronómetro (1 = reloj de verdad)",0.95,1.05,0.001],
  ["lag","Retraso de los números en pantalla (ms)",-100,200,5],
  ["dec","Decimales del cronómetro",0,3,1]];

var S={best:null,hist:[],games:0,cfg:Object.assign({},DEF)};
try{var raw=localStorage.getItem("justo_v1"); if(raw){var o=JSON.parse(raw); S=Object.assign(S,o); S.cfg=o.cfgV===CFGV?Object.assign({},DEF,o.cfg||{}):Object.assign({},DEF);} S.cfgV=CFGV; if(S.snd===undefined)S.snd=true; if(!S.games)S.games=S.hist.length;}catch(e){}
function save(){try{localStorage.setItem("justo_v1",JSON.stringify(S));}catch(e){}}

/* ---------- lógica (sin dibujo; también sirve para repetir partidas grabadas) ---------- */
function fmt(v,d){return v.toFixed(d).replace(".",",");}
function r4(v){return Math.round(v*1e4)/1e4;}
function measure(cfg,ms){ // de milisegundos entre los dos toques al resultado del juego
  var t=r4(ms/1000*cfg.speed), over=t>cfg.target;
  return {t:t, over:over, gap:over?null:r4(cfg.target-t)};
}
function shown(cfg,ms){ // lo que enseña el cronómetro "ms" milisegundos después del primer toque
  var v=ms/1000*cfg.speed-cfg.lag/1000; return Math.max(0,Math.min(cfg.target,v));
}
// Repite una partida grabada: instantes (s) del toque de inicio y del de parada. Devuelve lo que daría este juego.
function replay(sc){
  var cfg=Object.assign({},DEF,sc.cfg||{}), m=measure(cfg,(sc.taps[1]-sc.taps[0])*1000);
  return {exacto:fmt(m.t,4), falta:m.over?null:fmt(m.gap,4), pasado:m.over, marcador:fmt(Math.min(m.t,cfg.target),cfg.dec)};
}
window.Justo={replay:replay,measure:measure,shown:shown,DEF:DEF};

/* ---------- pantalla ---------- */
var stage=document.getElementById("stage"), cv=document.getElementById("cv"), ctx=cv.getContext("2d");
var over=document.getElementById("over"), card=document.getElementById("card"), elRec=document.getElementById("rec");
var scale=1, C={}, FONT="";
function colors(){var cs=getComputedStyle(document.documentElement);["sky","hills","col","cap","floor","floor-line","token","ring","ink","muted","surface","line","page"].forEach(function(n){C[n]=cs.getPropertyValue("--"+n).trim();});
  FONT=cs.getPropertyValue("--display").trim()||"sans-serif";}
function resize(){var r=stage.getBoundingClientRect(), d=Math.min(window.devicePixelRatio||1,3); if(!r.height)return;
  cv.width=Math.round(r.width*d); cv.height=Math.round(r.height*d); scale=Math.min(r.width/FW,r.height/H);
  var ox=(r.width-FW*scale)/2, oy=(r.height-H*scale)/2; ctx.setTransform(scale*d,0,0,scale*d,ox*d,oy*d);
  var hd=elRec.parentNode; hd.style.top=(oy+10)+"px"; hd.style.left=(ox+14)+"px"; hd.style.right=(ox+14)+"px";}
new ResizeObserver(resize).observe(stage);
new MutationObserver(colors).observe(document.documentElement,{attributes:true,attributeFilter:["data-theme"]});
matchMedia("(prefers-color-scheme: dark)").addEventListener("change",colors);
colors(); resize();

/* state: "menu" (tarjeta), "ready" (esperando el primer toque), "run" (contando), "done" (parado, enseñando el resultado) */
var state="menu", view="main", t0=0, res=null, doneAt=0, cardAt=0, fill=0, flash=0;
var AC=null;
function tone(f,f2,dur,vol,type){ if(!S.snd)return; try{ AC=AC||new (window.AudioContext||window.webkitAudioContext)(); if(AC.state==="suspended")AC.resume();
  var o=AC.createOscillator(), gn=AC.createGain(), t=AC.currentTime; o.type=type||"sine"; o.frequency.setValueAtTime(f,t); o.frequency.exponentialRampToValueAtTime(f2,t+dur);
  gn.gain.setValueAtTime(vol,t); gn.gain.exponentialRampToValueAtTime(0.001,t+dur); o.connect(gn); gn.connect(AC.destination); o.start(t); o.stop(t+dur);}catch(e){} }
function evTime(e){ // hora exacta del toque, en la misma escala que performance.now()
  var n=performance.now(), t=e&&e.timeStamp; return (t>0&&Math.abs(n-t)<5000)?t:n; }

function ready(){ state="ready"; res=null; fill=0; over.hidden=true; }
function begin(t){ state="run"; t0=t; tone(660,660,0.05,0.25,"triangle"); }
function finish(m){ // m: resultado de measure(), o {over:true,t:null} si llegó al final sin tocar
  state="done"; res=m; doneAt=performance.now(); flash=1;
  if(m.over)tone(200,70,0.35,0.35,"sawtooth"); else tone(990,990,0.06,0.3,"triangle");
  S.hist.push(m.over?-1:m.gap); if(S.hist.length>50)S.hist.shift(); S.games++;
  res.record=!m.over&&(S.best===null||m.gap<S.best); if(res.record)S.best=m.gap;
  save(); hud();
}
function tap(t){
  if(state==="ready"){begin(t); return;}
  if(state==="run"){finish(measure(S.cfg,t-t0)); return;}
  if(state==="menu"&&view==="main"&&performance.now()-cardAt>400)ready();
}
function hud(){ elRec.hidden=S.best===null; if(S.best!==null)elRec.textContent="Récord "+fmt(S.best,4)+" s"; }

/* ---------- dibujo ---------- */
function digits(str,x,y,px,color){ // cada cifra en una casilla del mismo ancho, para que no bailen
  ctx.font="800 "+px+"px "+FONT; ctx.textAlign="center"; ctx.textBaseline="middle"; ctx.fillStyle=color;
  var dw=ctx.measureText("0").width, cw=ctx.measureText(",").width+px*0.06, w=0, i;
  for(i=0;i<str.length;i++)w+=/\d/.test(str[i])?dw:cw;
  var xx=x-w/2;
  for(i=0;i<str.length;i++){var k=/\d/.test(str[i])?dw:cw; ctx.fillText(str[i],xx+k/2,y); xx+=k;}
}
function text(s,x,y,px,color,weight){ ctx.font=(weight||600)+" "+px+"px "+FONT; ctx.textAlign="center"; ctx.textBaseline="middle"; ctx.fillStyle=color; ctx.fillText(s,x,y); }
function draw(now,dt){
  var c=S.cfg, v=0, a0=-Math.PI/2;
  var R=state!=="run"&&state!=="ready"&&res; // resultado de la última partida (sigue detrás de la tarjeta)
  if(state==="run")v=shown(c,now-t0);
  else if(R)v=res.t===null?c.target:Math.min(res.t,c.target);
  var bad=R&&res.over;
  ctx.save(); ctx.setTransform(1,0,0,1,0,0); ctx.clearRect(0,0,cv.width,cv.height); ctx.restore();
  ctx.save(); ctx.beginPath(); ctx.rect(0,0,FW,H); ctx.clip();
  ctx.fillStyle=C.sky; ctx.fillRect(0,0,FW,H);
  ctx.fillStyle=C.hills; ctx.beginPath(); ctx.arc(CX,CY,RM+RW/2+30,0,7); ctx.fill();
  ctx.fillStyle=C.page; ctx.globalAlpha=0.5; ctx.fillRect(0,H-78,FW,78); ctx.globalAlpha=1;
  // anillo: pista y relleno (una vuelta entera en "target" segundos, desde arriba y en el sentido del reloj)
  fill=v/c.target;
  ctx.lineWidth=RW; ctx.lineCap="butt";
  ctx.strokeStyle=C.floor; ctx.beginPath(); ctx.arc(CX,CY,RM,0,7); ctx.stroke();
  if(fill>0){ ctx.strokeStyle=bad?C.token:C.col; ctx.beginPath(); ctx.arc(CX,CY,RM,a0,a0+2*Math.PI*Math.min(1,fill)); ctx.stroke(); }
  if(flash>0){ ctx.globalAlpha=flash*0.35; ctx.strokeStyle=bad?C.token:C.cap; ctx.lineWidth=RW+10*flash; ctx.beginPath(); ctx.arc(CX,CY,RM,0,7); ctx.stroke(); ctx.globalAlpha=1; flash=Math.max(0,flash-dt*2.5); }
  ctx.fillStyle=C.token; ctx.beginPath(); ctx.moveTo(CX,CY-RM-RW/2-4); ctx.lineTo(CX-7,CY-RM-RW/2-15); ctx.lineTo(CX+7,CY-RM-RW/2-15); ctx.closePath(); ctx.fill();
  digits(fmt(v,c.dec),CX,CY+4,c.dec>2?62:76,bad?C.token:C.ink);
  var yl=CY+RM+RW/2+52, goal=fmt(c.target,c.target%1?1:0);
  if(!R&&state!=="run"){ text("Toca para empezar",CX,yl,22,C.ink,800); text("y vuelve a tocar en "+goal+" s, sin pasarte",CX,yl+30,16,C.muted); }
  else if(state==="run") text("Para en "+goal,CX,yl,22,C.muted,800);
  else if(res.over){ text("¡Te has pasado!",CX,yl,24,C.token,800);
    text(res.t===null?"El cronómetro llegó a "+goal+" s":"Resultado exacto: "+fmt(res.t,4)+" s",CX,yl+30,16,C.muted); }
  else { text("Resultado exacto: "+fmt(res.t,4)+" s",CX,yl,18,C.ink,600); text("Te faltó "+fmt(res.gap,4)+" s",CX,yl+30,22,C.ink,800); }
  ctx.restore();
}
var last=0;
function frame(now){
  var dt=Math.min(0.1,(now-last)/1000); last=now;
  // Si llega al final sin toque, te has pasado. Se espera 50 ms más por si un toque de justo antes aún no ha llegado.
  if(state==="run"&&(now-t0)/1000*S.cfg.speed>S.cfg.target+0.05)finish({t:null,over:true,gap:null});
  if(state==="done"&&performance.now()-doneAt>1000){state="menu"; view="main"; panel();}
  draw(now,dt); requestAnimationFrame(frame);
}

/* ---------- tarjeta: resultado, estadísticas y ajustes ---------- */
function last10(){return S.hist.slice(-10);}
function avg(){var h=last10().filter(function(x){return x>=0;}); if(!h.length)return "–"; return fmt(h.reduce(function(a,b){return a+b;},0)/h.length,3);}
function barH(g){ if(g<0)return 2; var k=Math.log10(1/Math.max(g,0.001))/3; return Math.round(Math.max(0.06,Math.min(1,k))*30)+2; } // escala que premia acercarse: 1 s, 0,1 s, 0,01 s, 0,001 s
function panel(){
  over.hidden=false; cardAt=performance.now();
  if(view==="cfg"){
    card.innerHTML='<h2>Ajustes</h2><p>Valores sacados de grabaciones del juego real. Cámbialos solo si notas alguna diferencia; se guardan en este móvil.</p>'+
      FIELDS.map(function(f){return '<div class="field"><label for="f-'+f[0]+'"><span>'+f[1]+'</span><output id="o-'+f[0]+'">'+S.cfg[f[0]]+'</output></label>'+
      '<input type="range" id="f-'+f[0]+'" min="'+f[2]+'" max="'+f[3]+'" step="'+f[4]+'" value="'+S.cfg[f[0]]+'"></div>';}).join("")+
      '<label class="snd" for="f-snd"><input type="checkbox" id="f-snd"'+(S.snd?" checked":"")+'> Sonido al empezar y al parar</label>'+
      '<div class="row"><button class="btn" id="b-reset" type="button">Valores iniciales</button><button class="btn go" id="b-back" type="button">Listo</button></div>';
    FIELDS.forEach(function(f){var inp=document.getElementById("f-"+f[0]); inp.addEventListener("input",function(){S.cfg[f[0]]=parseFloat(inp.value);document.getElementById("o-"+f[0]).textContent=inp.value;save();});});
    document.getElementById("f-snd").onchange=function(e){S.snd=e.target.checked;save();};
    document.getElementById("b-reset").onclick=function(){S.cfg=Object.assign({},DEF);save();panel();};
    document.getElementById("b-back").onclick=function(){view="main";panel();};
    return;
  }
  var html="", h=last10(), i, fails=h.filter(function(x){return x<0;}).length;
  if(res){
    if(res.over) html+='<div><div class="lbl">Te has pasado'+(res.t===null?' · no paraste':'')+'</div><div class="big bad">'+fmt(res.t===null?S.cfg.target:res.t,res.t===null?2:4)+'<small>s</small></div></div>'+
      '<p>Si el cronómetro llega a '+fmt(S.cfg.target,S.cfg.target%1?1:0)+' s antes de que toques, se acaba.</p>';
    else html+='<div><div class="lbl">'+(res.record?"Nuevo récord · te faltó":"Te faltó")+'</div><div class="big">'+fmt(res.gap,4)+'<small>s</small></div></div>'+
      '<p>Paraste en '+fmt(res.t,4)+' s.</p>';
  }
  else{ var g=fmt(S.cfg.target,S.cfg.target%1?1:0);
    html+='<h2>Justo</h2><p>Toca para poner en marcha el cronómetro y vuelve a tocar lo más cerca posible de los '+g+' segundos, sin pasarte: si llega a '+g+', se acaba. Cuenta lo que te faltó; cuanto menos, mejor.</p>'; }
  html+='<dl class="stats"><div><dt>Récord</dt><dd>'+(S.best===null?"–":fmt(S.best,4))+'</dd></div><div><dt>Media 10</dt><dd>'+avg()+'</dd></div><div><dt>Partidas</dt><dd>'+S.games+'</dd></div></dl>';
  html+='<div><div class="lbl">Últimas 10 partidas (lo que faltó)</div><div class="days">';
  for(i=0;i<10;i++){var v=h[i-(10-h.length)], cl=[]; if(i===9&&v!==undefined)cl.push("today"); if(v<0)cl.push("fail");
    html+='<div'+(cl.length?' class="'+cl.join(" ")+'"':'')+'><span>'+(v===undefined?"·":v<0?"✕":fmt(v,2))+'</span><i style="height:'+(v===undefined?2:barH(v))+'px"></i></div>';}
  html+='</div>'+(fails?'<p class="note">✕ = te pasaste ('+fails+' de las '+h.length+'). La media es de las demás.</p>':'')+'</div>';
  html+='<div class="row"><button class="btn" id="b-cfg" type="button">Ajustes</button><button class="btn go" id="b-go" type="button">'+(res?"Otra vez":"Jugar")+'</button></div>';
  html+='<button class="btn clr" id="b-clr" type="button">Reiniciar estadísticas</button>';
  card.innerHTML=html;
  document.getElementById("b-cfg").onclick=function(){view="cfg";panel();};
  document.getElementById("b-go").onclick=ready;
  var clr=document.getElementById("b-clr"), armed=false;
  clr.onclick=function(){ if(!armed){armed=true; clr.textContent="¿Borrar récord, media y partidas? Toca otra vez"; return;}
    S.hist=[]; S.best=null; S.games=0; save(); res=null; hud(); panel(); };
}
stage.addEventListener("pointerdown",function(e){ if(e.target.closest(".card"))return; e.preventDefault(); tap(evTime(e)); });
stage.addEventListener("contextmenu",function(e){e.preventDefault();});
window.addEventListener("keydown",function(e){ if(e.repeat||(e.target.closest&&e.target.closest("input,button,a")))return;
  if(e.code==="Space"||e.code==="Enter"){e.preventDefault(); tap(evTime(e));} });

hud(); panel(); requestAnimationFrame(function(n){last=n;frame(n);});
})();
</script>
</body>
</html>
